[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar"
version = "0.2.0"
description = "Local RPA platform: deposited Python scenarios, a named team of robots, a live open space and a performance dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "keyring>=25",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45", "selenium>=4.20", "openpyxl>=3.1"]
# what the scenarios that drive a browser and send files need: Playwright (then `playwright install msedge`, or the
# Edge already on the PC), openpyxl to check the Excel exports, pywin32 to send through Outlook on Windows
rpa = ["selenium>=4.20", "playwright>=1.45", "openpyxl>=3.1", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
pulsar = "pulsar.__main__:main"

[tool.setuptools.packages.find]
include = ["pulsar*"]

[tool.setuptools.package-data]
pulsar = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
