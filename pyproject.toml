[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astree"
version = "0.2.0"
description = "Local RPA platform: deposited Python scenarios, a named team of robots, a live open space and a performance dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "keyring>=25",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
astree = "astree.__main__:main"

[tool.setuptools.packages.find]
include = ["astree*"]

[tool.setuptools.package-data]
astree = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
