[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greffier"
version = "0.1.0"
description = "Local RPA platform: robot configuration and performance dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
greffier = "greffier.__main__:main"

[tool.setuptools.packages.find]
include = ["greffier*"]

[tool.setuptools.package-data]
greffier = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
